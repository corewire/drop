{{- if and .Values.serviceMonitor.enabled .Values.metrics.enabled .Values.metrics.secureServing }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "drop.fullname" . }}-metrics-scraper
  labels:
    {{- include "drop.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drop.fullname" . }}-metrics-scraper-token
  labels:
    {{- include "drop.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "drop.fullname" . }}-metrics-scraper
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "drop.fullname" . }}-metrics-scraper
  labels:
    {{- include "drop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "drop.fullname" . }}-metrics-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "drop.fullname" . }}-metrics-scraper
    namespace: {{ .Release.Namespace }}
{{- end }}

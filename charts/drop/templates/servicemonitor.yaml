{{- if and .Values.serviceMonitor.enabled .Values.metrics.enabled }}
{{- if and .Values.metrics.secureServing (not .Values.certManager.enabled) }}
{{- fail "serviceMonitor.enabled with metrics.secureServing requires certManager.enabled=true so the scraper can verify the metrics TLS certificate" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "drop.fullname" . }}
  labels:
    {{- include "drop.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - port: https-metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- if .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- end }}
      {{- if .Values.metrics.secureServing }}
      scheme: https
      # Token is read from a Secret instead of bearerTokenFile, which is
      # rejected by Grafana Alloy and newer Prometheus Operator setups.
      authorization:
        type: Bearer
        credentials:
          name: {{ include "drop.fullname" . }}-metrics-scraper-token
          key: token
      tlsConfig:
        serverName: {{ include "drop.fullname" . }}-metrics.{{ .Release.Namespace }}.svc
        ca:
          secret:
            name: {{ include "drop.fullname" . }}-metrics-tls
            key: ca.crt
      {{- else }}
      scheme: http
      {{- end }}
  selector:
    matchLabels:
      {{- include "drop.selectorLabels" . | nindent 6 }}
{{- end }}
